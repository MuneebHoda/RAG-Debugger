name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle budget
        run: npm run size:check
      - name: Format
        run: npm run format:check
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npx playwright test

  migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rag_debugger
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rag_debugger
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install SQLx CLI
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres --locked
      - name: Run migrations
        run: sqlx migrate run
      - name: Verify Postgres evidence repository contract
        run: >-
          cargo test -p rag-debugger-storage
          --test evidence_repository_contract
          postgres_evidence_repository_is_deterministic_and_bounded
          -- --ignored
      - name: Verify Postgres Eval workspace isolation
        run: >-
          cargo test -p rag-debugger-storage
          --test eval_workspace_contract
          postgres_eval_repository_enforces_workspace_ownership
          -- --ignored
      - name: Verify Postgres runtime workspace isolation
        run: >-
          cargo test -p rag-debugger-storage
          --test runtime_workspace_contract
          postgres_runtime_repository_enforces_workspace_ownership
          -- --ignored
      - name: Verify Postgres trace ingestion contract
        run: >-
          cargo test -p rag-debugger-storage
          --test trace_ingestion_repository_contract
          postgres_trace_ingestion_repository_contract
          -- --ignored
      - name: Verify migration behavior
        run: >-
          cargo test -p rag-debugger-storage
          --test workspace_migration
          -- --ignored
      - name: Verify Postgres evidence query plans
        run: >-
          cargo test -p rag-debugger-storage
          postgres_evidence_query_plans_are_index_compatible
          -- --ignored

  production-artifacts:
    name: Production artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm --prefix apps/web ci
      - name: Install Playwright
        run: npx --prefix apps/web playwright install --with-deps chromium
      - name: Verify production artifacts
        env:
          CORPUSLAB_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/verify-production-artifacts.sh
      - name: Start production-parity stack
        env:
          CORPUSLAB_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: docker compose -f docker-compose.production.yml --profile production up --build --wait
      - name: Run packaged browser workflow
        working-directory: apps/web
        run: npx playwright test --config playwright.production.config.ts
      - name: Stop production-parity stack
        if: always()
        env:
          CORPUSLAB_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: docker compose -f docker-compose.production.yml --profile production down -v

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Generate technical handbook PDF
        run: npm run docs:pdf
