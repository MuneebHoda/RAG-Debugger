name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle budget
        run: npm run size:check
      - name: Format
        run: npm run format:check
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npx playwright test

  migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rag_debugger
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rag_debugger
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install SQLx CLI
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres --locked
      - name: Run migrations
        run: sqlx migrate run
      - name: Verify Postgres evidence repository contract
        run: >-
          cargo test -p rag-debugger-storage
          --test evidence_repository_contract
          postgres_evidence_repository_is_deterministic_and_bounded
          -- --ignored
      - name: Verify Postgres Eval workspace isolation
        run: >-
          cargo test -p rag-debugger-storage
          --test eval_workspace_contract
          postgres_eval_repository_enforces_workspace_ownership
          -- --ignored
      - name: Verify Postgres runtime workspace isolation
        run: >-
          cargo test -p rag-debugger-storage
          --test runtime_workspace_contract
          postgres_runtime_repository_enforces_workspace_ownership
          -- --ignored
      - name: Verify Postgres trace ingestion contract
        run: >-
          cargo test -p rag-debugger-storage
          --test trace_ingestion_repository_contract
          postgres_trace_ingestion_repository_contract
          -- --ignored
      - name: Verify migration behavior
        run: >-
          cargo test -p rag-debugger-storage
          --test workspace_migration
          -- --ignored
      - name: Verify Postgres evidence query plans
        run: >-
          cargo test -p rag-debugger-storage
          postgres_evidence_query_plans_are_index_compatible
          -- --ignored

  production-artifacts:
    name: Production artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm --prefix apps/web ci
      - name: Install Playwright
        run: npx --prefix apps/web playwright install --with-deps chromium
      - name: Verify production artifacts
        env:
          CORPUSLAB_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/verify-production-artifacts.sh
      - name: Start production-parity stack
        env:
          CORPUSLAB_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: docker compose -f docker-compose.production.yml --profile production up --build --wait
      - name: Run packaged browser workflow
        working-directory: apps/web
        run: npx playwright test --config playwright.production.config.ts
      - name: Stop production-parity stack
        if: always()
        env:
          CORPUSLAB_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: docker compose -f docker-compose.production.yml --profile production down -v

  release-dry-run:
    name: Release dry run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CORPUSLAB_API_IMAGE: corpuslab-api
      CORPUSLAB_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Test release policy
        run: node --test scripts/release-artifacts.test.mjs
      - name: Build API and web artifacts once without publishing
        id: build
        run: |
          export CORPUSLAB_VERSION
          CORPUSLAB_VERSION=$(node -p "require('./apps/web/package.json').version")
          ./scripts/build-release-artifacts.sh
          echo "version=$CORPUSLAB_VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify deterministic web package
        env:
          WEB_ARTIFACT: ${{ steps.build.outputs.web_artifact }}
        run: |
          cp "target/release-artifacts/$WEB_ARTIFACT" "$RUNNER_TEMP/$WEB_ARTIFACT"
          rm "target/release-artifacts/$WEB_ARTIFACT"
          (cd target/release-artifacts/web-application && find . -type f -print | LC_ALL=C sort | TZ=UTC zip -X -q "../$WEB_ARTIFACT" -@)
          cmp "$RUNNER_TEMP/$WEB_ARTIFACT" "target/release-artifacts/$WEB_ARTIFACT"
      - name: Generate API SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
          SYFT_FILE_METADATA_SELECTION: all
        with:
          image: ${{ steps.build.outputs.api_tag }}
          format: spdx-json
          output-file: target/release-artifacts/api.spdx.json
          syft-version: v1.51.1
          upload-artifact: false
          upload-release-assets: false
      - name: Generate web SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
          SYFT_FILE_METADATA_SELECTION: all
        with:
          path: target/release-artifacts/web-application
          format: spdx-json
          output-file: target/release-artifacts/web.spdx.json
          syft-version: v1.51.1
          upload-artifact: false
          upload-release-assets: false
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true
      - name: Scan final artifacts and enforce policy
        run: |
          trivy image --quiet --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed=false \
            --format json --output target/release-artifacts/api-trivy.json "${{ steps.build.outputs.api_tag }}"
          trivy fs --quiet --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed=false \
            --format json --output target/release-artifacts/web-trivy.json target/release-artifacts/web-application
          node scripts/release-artifacts.mjs verify-scan target/release-artifacts/api-trivy.json
          node scripts/release-artifacts.mjs verify-scan target/release-artifacts/web-trivy.json
      - name: Prove secret and vulnerability findings fail policy
        run: |
          mkdir "$RUNNER_TEMP/release-secret-fixture"
          node -e "require('node:fs').writeFileSync(process.argv[1], 'gh' + 'p_' + require('node:crypto').randomBytes(20).toString('hex'))" "$RUNNER_TEMP/release-secret-fixture/token.txt"
          trivy fs --quiet --scanners secret --format json --output "$RUNNER_TEMP/secret-report.json" "$RUNNER_TEMP/release-secret-fixture"
          if node scripts/release-artifacts.mjs verify-scan "$RUNNER_TEMP/secret-report.json"; then
            echo "secret-shaped fixture unexpectedly passed release policy" >&2
            exit 1
          fi
          node -e "require('node:fs').writeFileSync(process.argv[1], JSON.stringify({SchemaVersion:2,Results:[{Target:'fixture',Vulnerabilities:[{VulnerabilityID:'CVE-TEST',PkgName:'fixture',Severity:'CRITICAL'}]}]}))" "$RUNNER_TEMP/vulnerability-report.json"
          if node scripts/release-artifacts.mjs verify-scan "$RUNNER_TEMP/vulnerability-report.json"; then
            echo "vulnerability fixture unexpectedly passed release policy" >&2
            exit 1
          fi
      - name: Create and verify dry-run release manifest
        env:
          CORPUSLAB_RELEASE_MODE: dry-run
          CORPUSLAB_VERSION: ${{ steps.build.outputs.version }}
        run: |
          export CORPUSLAB_API_DIGEST
          CORPUSLAB_API_DIGEST=$(docker image inspect --format '{{.Id}}' "${{ steps.build.outputs.api_tag }}")
          node scripts/release-artifacts.mjs create-manifest
          node scripts/release-artifacts.mjs verify-manifest target/release-artifacts/release-manifest.dry-run.json dry-run

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Generate technical handbook PDF
        run: npm run docs:pdf
