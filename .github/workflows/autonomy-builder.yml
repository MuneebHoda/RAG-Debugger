name: Autonomous Builder

on:
  issues:
    types:
      - labeled
  push:
    branches:
      - main
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Diagnostic mode; neither option invokes Codex or publishes a branch.
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - dry-run

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: bounded-autonomous-builder
  cancel-in-progress: false

env:
  AUTONOMY_PAUSED: ${{ vars.AUTONOMY_PAUSED || 'true' }}
  AUTONOMY_APPROVERS: ${{ vars.AUTONOMY_APPROVERS || 'MuneebHoda' }}
  AUTONOMY_BUILDER_RECONCILE_ENABLED: ${{ vars.AUTONOMY_BUILDER_RECONCILE_ENABLED || 'false' }}

jobs:
  preflight:
    name: Builder preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      execute_model: ${{ steps.preflight.outputs.execute_model }}
      issue_number: ${{ steps.preflight.outputs.issue_number }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Run deterministic preflight
        id: preflight
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_TOKEN: ${{ github.token }}
          HAS_AUTONOMY_APP: ${{ secrets.AUTONOMY_APP_ID != '' && secrets.AUTONOMY_APP_PRIVATE_KEY != '' }}
          HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: node scripts/autonomy/autonomy.mjs builder-preflight "$RUNNER_TEMP/builder-context"
      - name: Upload sanitized builder context
        if: steps.preflight.outputs.execute_model == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: builder-context
          path: ${{ runner.temp }}/builder-context
          retention-days: 1
          if-no-files-found: error

  claim:
    name: Claim approved issue
    needs: preflight
    if: needs.preflight.outputs.execute_model == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact trusted base
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download builder context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: builder-context
          path: ${{ runner.temp }}/builder-context
      - name: Create claim-only GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AUTONOMY_APP_ID }}
          private-key: ${{ secrets.AUTONOMY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: read
      - name: Claim one issue
        env:
          AUTONOMY_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/autonomy/autonomy.mjs claim-issue "$RUNNER_TEMP/builder-context/builder-context.json"

  generate:
    name: Generate candidate
    needs:
      - preflight
      - claim
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact trusted base
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download builder context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: builder-context
          path: ${{ runner.temp }}/builder-context
      - name: Preserve trusted automation
        run: |
          mkdir -p "$RUNNER_TEMP/trusted/.github" "$RUNNER_TEMP/trusted/scripts"
          cp -R .github/autonomy "$RUNNER_TEMP/trusted/.github/autonomy"
          cp -R scripts/autonomy "$RUNNER_TEMP/trusted/scripts/autonomy"
      - name: Prepare builder prompt
        env:
          AUTONOMY_REPOSITORY_ROOT: ${{ github.workspace }}
          AUTONOMY_TRUSTED_ROOT: ${{ runner.temp }}/trusted
        run: >-
          node "$RUNNER_TEMP/trusted/scripts/autonomy/autonomy.mjs"
          prepare-prompt builder
          "$RUNNER_TEMP/builder-context/builder-context.json"
          "$RUNNER_TEMP/builder-prompt.md"
      - name: Recheck pause before generation
        run: >-
          node "$RUNNER_TEMP/trusted/scripts/autonomy/autonomy.mjs"
          assert-unpaused generation
      - name: Run bounded builder
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/builder-prompt.md
          output-file: ${{ runner.temp }}/builder-output.json
          output-schema-file: ${{ runner.temp }}/trusted/.github/autonomy/schemas/builder-output.schema.json
          working-directory: ${{ github.workspace }}
          sandbox: workspace-write
          safety-strategy: drop-sudo
          codex-version: 0.146.0
          model: gpt-5.6-sol
          effort: high
          allow-bots: true
          allow-bot-users: github-actions[bot]
      - name: Capture bounded candidate
        env:
          AUTONOMY_REPOSITORY_ROOT: ${{ github.workspace }}
          AUTONOMY_TRUSTED_ROOT: ${{ runner.temp }}/trusted
        run: >-
          node "$RUNNER_TEMP/trusted/scripts/autonomy/autonomy.mjs"
          capture-candidate
          "$RUNNER_TEMP/builder-output.json"
          "$RUNNER_TEMP/builder-context/builder-context.json"
          "$RUNNER_TEMP/candidate"
      - name: Upload untrusted candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: builder-candidate
          path: ${{ runner.temp }}/candidate
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  validate:
    name: Validate candidate
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact trusted base
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preserve trusted automation
        run: |
          mkdir -p "$RUNNER_TEMP/trusted/.github" "$RUNNER_TEMP/trusted/scripts"
          cp -R .github/autonomy "$RUNNER_TEMP/trusted/.github/autonomy"
          cp -R scripts/autonomy "$RUNNER_TEMP/trusted/scripts/autonomy"
      - name: Download candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: builder-candidate
          path: ${{ runner.temp }}/candidate
      - name: Recheck pause before validation
        run: >-
          node "$RUNNER_TEMP/trusted/scripts/autonomy/autonomy.mjs"
          assert-unpaused validation
      - name: Apply candidate safely
        env:
          AUTONOMY_REPOSITORY_ROOT: ${{ github.workspace }}
          AUTONOMY_TRUSTED_ROOT: ${{ runner.temp }}/trusted
        run: node "$RUNNER_TEMP/trusted/scripts/autonomy/autonomy.mjs" apply-candidate "$RUNNER_TEMP/candidate"
      - name: Validate candidate policy
        env:
          AUTONOMY_REPOSITORY_ROOT: ${{ github.workspace }}
          AUTONOMY_TRUSTED_ROOT: ${{ runner.temp }}/trusted
        run: >-
          node "$RUNNER_TEMP/trusted/scripts/autonomy/autonomy.mjs"
          validate-candidate
          "$RUNNER_TEMP/candidate"
          "$RUNNER_TEMP/trusted"
          "$RUNNER_TEMP/attestation.json"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Cache Rust
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Install Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Install database and security tools
        run: |
          cargo install sqlx-cli --no-default-features --features rustls,postgres --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Run trusted complete quality gate
        run: >-
          "$RUNNER_TEMP/trusted/scripts/autonomy/run-quality.sh"
          "$GITHUB_WORKSPACE"
      - name: Package validated candidate
        run: |
          mkdir -p "$RUNNER_TEMP/validated"
          cp -R "$RUNNER_TEMP/candidate/." "$RUNNER_TEMP/validated/"
          cp "$RUNNER_TEMP/attestation.json" "$RUNNER_TEMP/validated/attestation.json"
      - name: Upload validated candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: builder-validated
          path: ${{ runner.temp }}/validated
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  publish:
    name: Publish draft pull request
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact trusted base
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download validated candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: builder-validated
          path: ${{ runner.temp }}/validated
      - name: Recheck pause before publication
        run: node scripts/autonomy/autonomy.mjs assert-unpaused publication
      - name: Create publication-only GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AUTONOMY_APP_ID }}
          private-key: ${{ secrets.AUTONOMY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Publish validated draft
        env:
          AUTONOMY_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          node scripts/autonomy/autonomy.mjs publish-builder
          "$RUNNER_TEMP/validated"
          "$RUNNER_TEMP/validated/attestation.json"

  block:
    name: Record blocked attempt
    needs:
      - preflight
      - claim
      - generate
      - validate
      - publish
    if: ${{ always() && needs.preflight.outputs.execute_model == 'true' && needs.claim.result == 'success' && needs.publish.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact trusted base
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download builder context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: builder-context
          path: ${{ runner.temp }}/builder-context
      - name: Create issue-only GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AUTONOMY_APP_ID }}
          private-key: ${{ secrets.AUTONOMY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          permission-contents: read
          permission-issues: write
      - name: Mark attempt blocked without retry
        env:
          AUTONOMY_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          node scripts/autonomy/autonomy.mjs block-issue
          "$RUNNER_TEMP/builder-context/builder-context.json"
          "generation, deterministic validation, or publication"
