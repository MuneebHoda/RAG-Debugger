name: Security / Privacy
description: Track privacy posture, sensitive data handling, auth, retention, or audit concerns.
title: "security: "
labels: ["type/security"]
body:
  - type: markdown
    attributes:
      value: |
        Use this public form for non-sensitive security hardening and privacy-design work only. Report suspected vulnerabilities through [GitHub private vulnerability reporting](https://github.com/MuneebHoda/RAG-Debugger/security/advisories/new). Never include secrets, credentials, customer corpus/query content, traces, or other sensitive data.
  - type: textarea
    id: concern
    attributes:
      label: Concern
      description: What sensitive data, tenant boundary, retention rule, or security control is affected?
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who is affected and how severe is the risk?
    validations:
      required: true
  - type: textarea
    id: mitigation
    attributes:
      label: Proposed Mitigation
      description: Controls, tests, docs, or operational steps required.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - priority/p0
        - priority/p1
        - priority/p2
        - priority/p3
    validations:
      required: true
