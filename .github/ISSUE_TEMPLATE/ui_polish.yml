name: UI Polish
description: Improve visual quality, usability, interaction, or responsive behavior.
title: "ui: "
labels: ["area/web"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, credentials, customer corpus content, queries, traces, or other sensitive data. Report suspected vulnerabilities through [GitHub private vulnerability reporting](https://github.com/MuneebHoda/RAG-Debugger/security/advisories/new), not this public form.
  - type: textarea
    id: surface
    attributes:
      label: Surface
      description: Page, component, route, or workflow to improve.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: UX Issue
      description: What feels confusing, bulky, slow, inconsistent, or unpolished?
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: Target Experience
      description: What should the user see or feel after the change?
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Proof
      description: Screenshots, responsive checks, accessibility checks, or tests required.
